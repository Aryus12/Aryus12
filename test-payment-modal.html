<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Modal Paiement</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #f5f5f5;
        }

        .test-btn {
            padding: 15px 30px;
            background: #6366f1;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin: 10px;
        }

        .payment-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 9999;
            align-items: center;
            justify-content: center;
        }

        .payment-modal.active {
            display: flex;
        }

        .payment-modal-content {
            background: white;
            border-radius: 20px;
            width: 90%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 24px;
        }

        .payment-methods {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin: 20px 0;
        }

        .payment-method-option {
            cursor: pointer;
            position: relative;
        }

        .payment-method-option input {
            position: absolute;
            opacity: 0;
            cursor: pointer;
        }

        .payment-method-card {
            padding: 20px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            transition: all 0.2s;
            background: white;
        }

        .payment-method-card:hover {
            border-color: #6366f1;
            background: rgba(99, 102, 241, 0.02);
        }

        .payment-method-card i {
            font-size: 2rem;
            color: #64748b;
        }

        .payment-method-card span {
            font-size: 0.9rem;
            font-weight: 600;
            color: #1a1a2e;
        }

        .payment-method-option input:checked + .payment-method-card {
            border-color: #6366f1;
            background: rgba(99, 102, 241, 0.1);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .payment-method-option input:checked + .payment-method-card i {
            color: #6366f1;
        }

        .payment-method-option input:checked + .payment-method-card span {
            color: #6366f1;
        }

        .mobile-money-providers {
            margin-top: 12px;
            display: none;
        }

        .mobile-money-providers.show {
            display: block;
        }

        .mobile-money-providers select {
            width: 100%;
            padding: 10px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
        }

        .phone-group {
            margin-top: 12px;
            display: none;
        }

        .phone-group.show {
            display: block;
        }

        .phone-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <h1>Test Modal de Paiement</h1>
    <button class="test-btn" onclick="openModal()">Ouvrir le Modal</button>

    <div class="payment-modal" id="paymentModal">
        <div class="payment-modal-content">
            <h2>Choisissez votre méthode de paiement</h2>
            
            <div class="payment-methods">
                <label class="payment-method-option">
                    <input type="radio" name="paymentMethod" value="card" checked>
                    <div class="payment-method-card">
                        <i class="fas fa-credit-card"></i>
                        <span>Carte bancaire</span>
                    </div>
                </label>
                <label class="payment-method-option">
                    <input type="radio" name="paymentMethod" value="mobile_money">
                    <div class="payment-method-card">
                        <i class="fas fa-mobile-alt"></i>
                        <span>Mobile Money</span>
                    </div>
                </label>
            </div>

            <div class="phone-group" id="phoneGroup">
                <label>Téléphone:</label>
                <input type="tel" placeholder="+225 07 00 00 00 00">
            </div>

            <div class="mobile-money-providers" id="mobileProviders">
                <label>Fournisseur:</label>
                <select>
                    <option value="orange">Orange Money</option>
                    <option value="mtn">MTN Mobile Money</option>
                    <option value="moov">Moov Money</option>
                    <option value="wave">Wave</option>
                    <option value="free">Free Money</option>
                </select>
            </div>

            <button class="test-btn" onclick="closeModal()" style="width: 100%; margin-top: 20px;">Fermer</button>
        </div>
    </div>

    <script>
        function openModal() {
            document.getElementById('paymentModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('paymentModal').classList.remove('active');
        }

        // Payment method toggle
        document.querySelectorAll('input[name="paymentMethod"]').forEach(radio => {
            radio.addEventListener('change', function() {
                const phoneGroup = document.getElementById('phoneGroup');
                const mobileProviders = document.getElementById('mobileProviders');
                
                if (this.value === 'mobile_money') {
                    phoneGroup.classList.add('show');
                    mobileProviders.classList.add('show');
                } else {
                    phoneGroup.classList.remove('show');
                    mobileProviders.classList.remove('show');
                }
            });
        });

        // Close modal on outside click
        document.getElementById('paymentModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });
    </script>
</body>
</html>
